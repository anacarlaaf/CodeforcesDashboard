name: Ranking mensal Telegram

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar se hoje é o último dia do mês
        id: check
        run: |
          tomorrow=$(date -u -d "+1 day" +%d)
          if [ "$tomorrow" == "01" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Enviar ranking mensal
        if: steps.check.outputs.run == 'true'
        env:
          CODEFORCES_USERS: ${{ secrets.CODEFORCES_USERS }}
          CSES_ACCOUNTS: ${{ secrets.CSES_ACCOUNTS }}
          TELEGRAM_BOT_ID: ${{ secrets.TELEGRAM_BOT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_rankings.py --period mensal