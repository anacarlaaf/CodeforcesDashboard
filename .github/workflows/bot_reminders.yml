name: Bot de Lembretes (Contínuo)

on:
  schedule:
    # Verifica a cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Instalar dependências
      run: |
        pip install python-telegram-bot pandas pytz requests beautifulsoup4 plotly streamlit
    
    - name: Criar diretório de dados
      run: mkdir -p data
    
    - name: Verificar e enviar lembretes
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CODEFORCES_USERS: ${{ secrets.CODEFORCES_USERS }}
        CSES_ACCOUNTS: ${{ secrets.CSES_ACCOUNTS }}
      run: |
        cd ${{ github.workspace }}
        # Executa apenas a verificação de lembretes, não mantém o bot rodando
        python -c "
from telegram_bot import check_and_send_reminders, application
import asyncio
import logging

logging.basicConfig(level=logging.INFO)

# Inicializa o bot
app = application
app.bot = app.bot

# Verifica e envia lembretes
check_and_send_reminders(app)
"