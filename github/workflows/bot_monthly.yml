name: Ranking mensal Telegram

on:
  schedule:
    - cron: "0 21 28-31 * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Enviar ranking mensal
        env:
          CODEFORCES_USERS: ${{ secrets.CODEFORCES_USERS }}
          CSES_ACCOUNTS: ${{ secrets.CSES_ACCOUNTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_rankings.py --period mensal